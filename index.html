<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camino de Vida</title>
<style>
:root{--noche:#14161c;--asfalto:#2a2e38;--papel:#f6f1ea;--tinta:#1d2230;--azul:#2f80ff;--naranja:#ff8a1f;--rojo:#e5253d;--lila:#7a3b8f}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--noche);color:var(--papel);min-height:100vh;line-height:1.5}
h1,h2{font-family:'Fraunces',Georgia,serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;padding:12px 0 18px}
header h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;color:#fff}
header p{color:#c9c3d6;max-width:52ch;margin:6px auto 0}
.card{background:var(--papel);color:var(--tinta);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hidden{display:none!important}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select{width:100%;padding:12px;border:2px solid #cfc6d8;border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--lila);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.control{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-weight:600}
.control input{width:22px;height:22px;margin-top:3px}
.btn{display:inline-block;margin-top:18px;background:var(--lila);color:#fff;border:0;border-radius:12px;padding:14px 26px;font:800 1rem 'Nunito',sans-serif;cursor:pointer;transition:filter .2s}
.btn:hover{filter:brightness(1.1)}
.error{color:#b3142b;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<main>
<header>
<h1>Camino de Vida</h1>
<p>Simulador interactivo</p>
</header>
<section class="card">
<div id="app">¡Bienvenido al simulador de Camino de Vida! El sistema está funcionando correctamente.</div>
</section>
</main>
</body>
</html>
